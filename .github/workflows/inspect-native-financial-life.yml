name: Inspect text drawn into native PDF page images
on:
  push:
    branches: [fix/financial-life-samples-dual-store-20261122]
    paths:
      - '.github/one-shot/inspect-native-financial-life-ocr.trigger'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identify financial planning headers in image-based sample PDFs
        run: |
          python -m pip install -q PyMuPDF==1.26.4
          if ! command -v tesseract >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr >/dev/null; fi
          python - <<'PY'
          import fitz,subprocess
          from pathlib import Path
          for age,target in [(50,10),(25,5)]:
            doc=fitz.open(f'examples/mws-native-age-{age}-usd-20261014-v2.pdf')
            assert doc.authenticate('MWS-DEMO-2026')
            print('REPORT',age,'PAGE_COUNT',doc.page_count,flush=True)
            for i,p in enumerate(doc):
              clip=fitz.Rect(0,0,p.rect.width,min(88,p.rect.height))
              png=p.get_pixmap(matrix=fitz.Matrix(2,2),clip=clip,alpha=False).tobytes('png')
              result=subprocess.run(['tesseract','stdin','stdout','--psm','6'],input=png,capture_output=True,check=True)
              title=' '.join(result.stdout.decode(errors='replace').split())
              print('TITLE',age,i+1,repr(title[:170]),flush=True)
              if i==target:
                clip=fitz.Rect(25,98,568,195)
                png=p.get_pixmap(matrix=fitz.Matrix(3,3),clip=clip,alpha=False).tobytes('png')
                result=subprocess.run(['tesseract','stdin','stdout','--psm','6'],input=png,capture_output=True,check=True)
                print('SUMMARY',age,i+1,repr(' '.join(result.stdout.decode(errors='replace').split())),flush=True)
          PY
