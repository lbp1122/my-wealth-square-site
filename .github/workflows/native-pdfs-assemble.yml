name: Publish native MWS sample PDFs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-pdfs-assemble.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pypdf==5.9.0 PyMuPDF==1.26.4
      - run: python scripts/assemble_native_pdfs.py
      - name: Publish encrypted PDF reports
        run: |
          git config user.name 'mws-report-publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/mws-native-age-*-usd-20261014.pdf examples/previews/native-age-*.png
          git rm -r -f examples/native-parts
          git commit -m 'docs(site): publish verified native MWS USD reports'
          git push
