name: Publish Financial Life native sample PDFs v3
on:
  push:
    branches: [fix/financial-life-samples-dual-store-20261122]
    paths:
      - '.github/one-shot/publish-financial-life-pdf-v3.trigger'
permissions:
  contents: write
concurrency:
  group: financial-life-native-pdf-sample-v3
  cancel-in-progress: false
jobs:
  build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-based PDF rendering and inspection tools
        run: |
          python -m pip install -q PyMuPDF==1.26.4
          if ! command -v tesseract >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr >/dev/null; fi
      - name: Rebrand both samples without changing any figures or the 3-by-3 grid
        run: python scripts/rebrand_native_financial_life_samples.py
      - name: Verify sample page uses both stores and both new PDF filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('sample-reports.html').read_text()
          assert 'href="#download"' in html
          assert 'https://apps.apple.com/app/my-wealth-square/id6827556663' in html
          assert 'https://play.google.com/store/apps/details?id=com.lbp.balancesheetsquare' in html
          assert '<section class="sample-store-panel" id="download"' in html
          for age in [25,50]:
            assert html.count(f'mws-native-age-{age}-usd-20261014-v3.pdf')==2
            assert Path(f'examples/mws-native-age-{age}-usd-20261014-v3.pdf').stat().st_size>5000000
          print('PASS: dual-store links, PDF paths, and regenerated native samples')
          PY
      - name: Commit new AES-256-encrypted PDF samples and private visual QA crops
        run: |
          git config user.name 'mws-sample-docs-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/mws-native-age-25-usd-20261014-v3.pdf \
                  examples/mws-native-age-50-usd-20261014-v3.pdf \
                  qa/financial-life/*.b64
          git diff --cached --quiet && { echo "No changed PDF files"; exit 1; }
          git commit -m 'docs: publish validated Financial Life encrypted sample PDFs v3'
          git push origin HEAD:fix/financial-life-samples-dual-store-20261122
