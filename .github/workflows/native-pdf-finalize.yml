name: Polish native MWS PDFs
on:
  push:
    branches: [main]
    paths:
      - 'scripts/polish_native_reports.py'
      - '.github/workflows/native-pdf-finalize.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mws-polished-native-samples
  cancel-in-progress: true
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: python -m pip install --quiet pypdf==5.9.0 PyMuPDF==1.26.4 'cryptography>=43,<47'
      - name: Fix overlapping native sample PDF cover totals
        run: python scripts/polish_native_reports.py
      - name: Publish versioned PDF samples
        run: |
          git config user.name 'mws-native-pdf-qa'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/mws-native-age-*-usd-20261014-v2.pdf examples/previews/native-age-*-v2.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs(site): publish verified native-style MWS PDF reports v2'
            git pull --rebase origin main
            git push
          fi
