name: Generate encrypted fictional sample PDFs
on:
  push:
    branches: [main]
    paths:
      - '.github/RUN_DEMO_PDFS'
      - 'examples/build_demo_reports.py'
      - '.github/workflows/demo-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mws-demo-pdfs
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 pypdf==5.9.0 cryptography>=41 'pymupdf>=1.24,<2'
      - name: Generate fictional examples and verify encryption
        run: |
          set -euo pipefail
          python examples/build_demo_reports.py
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          for age, min_assets in ((50, 33),(25, 11)):
            p=Path(f'examples/mws-demo-age-{age}.pdf')
            assert p.is_file() and p.stat().st_size>10000
            r=PdfReader(p)
            assert r.is_encrypted and r.decrypt('MWS-DEMO-2026')
            content=' '.join(x.extract_text() or '' for x in r.pages)
            assert ('US$1,000,000' if age==50 else 'US$50,000') in content
            assert 'DEMO-LOAN-' in content and 'DEMO-BROKER-' in content
            assert 'MYR' not in content and 'RM0' not in content
            for token in ['NET WORTH','2024-10-14','2026-10-14','90']:
              assert token.casefold() in content.casefold(),(age,token)
            print(age,len(r.pages),p.stat().st_size)
          PY
      - name: Render sample report visual QA previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          previews=Path('examples/previews')
          previews.mkdir(parents=True,exist_ok=True)
          for age in (50,25):
            doc=fitz.open(f'examples/mws-demo-age-{age}.pdf')
            assert doc.is_encrypted
            assert doc.authenticate('MWS-DEMO-2026')
            page_text=[p.get_text('text') for p in doc]
            targets={
              'cover':0,
              'progress':next(i for i,s in enumerate(page_text) if 'Progress History' in s),
              'inventory':next(i for i,s in enumerate(page_text) if 'Wealth Inventory Report' in s),
              'simulator':next(i for i,s in enumerate(page_text) if 'Financial Life Simulator' in s),
              'annual':next(i for i,s in enumerate(page_text) if 'Yearly balances to age 90' in s)
            }
            for name,page_idx in targets.items():
              pix=doc.load_page(page_idx).get_pixmap(matrix=fitz.Matrix(1.25,1.25),alpha=False)
              output=previews / f'age-{age}-{name}.png'
              pix.save(str(output))
              print(output,'page',page_idx+1,'size',output.stat().st_size)
          PY
      - name: Publish encrypted sample PDFs in website repository
        run: |
          git config user.name 'mws-sample-docs-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/mws-demo-age-25.pdf examples/mws-demo-age-50.pdf examples/previews/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs(site): publish protected fictional MWS report examples'
            git push
          fi
